<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ONI &amp; Co. プロジェクト管理</title>
<link rel="icon" href="logo/onico-icon-red.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- ログイン画面（未ログイン時だけ表示） -->
<div class="auth-screen" id="auth-screen" hidden></div>

<div class="app-root" id="app-root" hidden>

<header class="appbar">
  <div class="brand">
    <span class="brand-sub">プロジェクト管理</span>
  </div>
  <nav class="tabs" id="tabs">
    <button class="tab is-active" data-tab="gantt">
      <svg viewBox="0 0 24 24"><path d="M4 6h9M8 12h11M4 18h7"/></svg>
      ガント
    </button>
    <button class="tab" data-tab="tasks">
      <svg viewBox="0 0 24 24"><path d="M3.5 6.5 5.5 8.5 9 5"/><path d="M12.5 7H21"/><path d="M3.5 15.5 5.5 17.5 9 14"/><path d="M12.5 16H21"/></svg>
      タスク管理
    </button>
    <button class="tab" data-tab="ideas">
      <svg viewBox="0 0 24 24"><path d="M9.5 18h5"/><path d="M10.5 21h3"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.5.4.8 1 .9 1.6l.1.6h5.2l.1-.6c.1-.6.4-1.2.9-1.6A6 6 0 0 0 12 3Z"/></svg>
      アイデアmemo
    </button>
    <button class="tab" data-tab="members">
      <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      担当者
    </button>
  </nav>
  <div class="appbar-right">
    <span class="me-badge" id="me-badge"></span>
  </div>
</header>

<!-- ------------------------------------------------------------ ガント -->
<section class="panel" data-panel="gantt">
  <div class="toolbar">
    <div class="seg" id="view-switch">
      <button data-view="year">年間</button>
      <button data-view="quarter">四半期</button>
      <button class="is-active" data-view="month">月間</button>
      <button data-view="week">週間</button>
    </div>

    <div class="navgroup">
      <button class="btn btn-icon" id="nav-prev" title="前へ">‹</button>
      <button class="btn btn-ghost" id="nav-today">今日</button>
      <button class="btn btn-icon" id="nav-next" title="次へ">›</button>
    </div>

    <div class="range-label" id="range-label"></div>
    <div class="outside-count" id="outside-count"></div>

    <div class="spacer"></div>

    <input type="search" id="search" class="input" placeholder="項目を検索…">

    <div class="filter-menu">
      <button class="btn btn-ghost" id="btn-filter">絞り込み <span class="filter-count" id="filter-count"></span></button>
      <div class="popover" id="filter-popover" hidden>
        <div class="popover-sec">
          <div class="popover-title">グループ</div>
          <div id="filter-groups"></div>
        </div>
        <div class="popover-sec">
          <div class="popover-title">ステータス</div>
          <div id="filter-statuses"></div>
        </div>
        <div class="popover-sec">
          <div class="popover-title">媒体</div>
          <div id="filter-channels"></div>
        </div>
        <button class="btn btn-ghost btn-block" id="filter-reset">絞り込みを解除</button>
      </div>
    </div>
  </div>

  <div class="gantt-scroll" id="gantt-scroll">
    <div class="gantt" id="gantt"></div>
  </div>

  <div class="bulkbar" id="bulkbar" hidden></div>

  <div class="legend">
    <div class="legend-groups" id="legend-groups"></div>
    <span class="legend-hint">空きセルを横ドラッグで新規作成／バーはドラッグで移動・両端で期間変更／項目名は上下ドラッグで並び替え</span>
  </div>
</section>

<!-- --------------------------------------------------- タスク管理 -->
<section class="panel" data-panel="tasks" hidden>
  <div class="task-layout">
    <nav class="task-nav" id="task-nav"></nav>
    <div class="task-main" id="task-main"></div>
  </div>
</section>

<!-- ------------------------------------------------------ アイデアmemo -->
<section class="panel" data-panel="ideas" hidden>
  <div class="sheet">
    <div class="idea-new">
      <div class="idea-author-row">
        <span class="idea-author-label">記載者</span>
        <span id="idea-author-pick"></span>
      </div>
      <textarea class="input" id="idea-body" rows="3" placeholder="思いついたことを書き留める…"></textarea>
      <input class="input" id="idea-url" placeholder="参考URL（任意）">
      <button class="btn btn-primary" id="idea-add">追加</button>
    </div>
    <div id="idea-list"></div>
  </div>
</section>

<!-- --------------------------------------------------------- 担当者 -->
<section class="panel" data-panel="members" hidden>
  <div class="sheet">
    <div class="member-add">
      <input class="input" id="member-name" placeholder="担当者名">
      <button class="btn btn-primary" id="member-add-btn">＋ 追加</button>
    </div>
    <div id="member-list"></div>
  </div>
</section>

<!-- ------------------------------------------------------- 詳細パネル -->
<div class="overlay" id="overlay" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="項目の詳細"></aside>

<!-- ------------------------------------------------- 汎用モーダル -->
<div class="modal-overlay" id="modal-overlay" hidden>
  <div class="modal" id="modal" role="dialog"></div>
</div>

</div><!-- /#app-root -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/model.js"></script>
<script src="js/ui.js"></script>
<script src="js/store.js"></script>
<script src="js/gantt.js"></script>
<script src="js/detail.js"></script>
<script src="js/app.js"></script>
</body>
</html>
